# Blinkit Hot Wheels bot — non-secret configuration.
# Secrets live in .env only. See .env.example.

# Watch targets, bought one at a time. 'id' is the Blinkit prid from the URL and
# is the key the single-order lock is stored under. Both titles were verified
# against the live pages on 2026-11-07.
products:
  - id: "1454828"
    name: "Hot Wheels Fast & Furious Edition Toyota Supra Die Cast Car"
    url: "https://blinkit.com/prn/x/prid/1454828"
    max_price_inr: 659        # listed Rs 549, +20% tolerance
    quantity: 1               # one unit per order
    max_orders: 3             # separate orders; the next once the previous is confirmed (D14)
  - id: "1416802"
    name: "Hot Wheels 23 Ram 1500 Die Cast Car"
    url: "https://blinkit.com/prn/hot-wheels-23-ram-1500-die-cast-car/prid/1416802"
    max_price_inr: 215        # listed Rs 179, +20% tolerance
    quantity: 1
    max_orders: 3

delivery:
  # Blinkit renders the saved address as a Plus Code plus area, e.g.
  # "WM5V+49W, Doddakannelli, Bengaluru, Karnataka" - there is no pincode on the
  # page, so the label must be a token that actually appears in that string.
  label: "Doddakannelli"
  lat: 0.0
  lng: 0.0
  pincode: "560035"           # not shown on the page; used only as a fallback match

mode: "C"                     # A notify only | B cart + confirm | C full auto-order (COD)

polling:
  interval_seconds: 60        # floor is 20s x number of targets = 40s
  jitter_seconds: 15

payment:
  priority: ["cod"]           # web checkout has no Blinkit Money (D9)
  max_order_value_inr: 750    # ceiling on any ONE order (1 unit), incl. fees
  otp_relay_timeout_seconds: 120

safety:
  max_orders_total: 6         # must equal the sum of products' max_orders
  stop_after_success: true    # exit once every target is bought
  # Backstop on the SUM of all orders (COD cash). 3 x 659 + 3 x 215 + fees;
  # never blocks a legitimate order, catches a wrong price or a bug.
  max_total_spend_inr: 3000

reliability:
  recycle_hours: 6
  heartbeat_hours: 6

# All Blinkit CSS selectors live here and nowhere else, so a UI change is a
# config edit rather than a code change.
selectors:
  # Verified 2026-11-07 against live Blinkit product HTML; each unique in the DOM.
  # "tw-" classes are Tailwind utilities (deterministic). styled-components
  # classes carry a per-build hash, so match the stable name prefix with class*=.
  product_title: 'div.tw-line-clamp-50'
  product_id: ""
  header_address: 'div[class*="LocationBar__Container"]'
  # The sticky bar's status line. Blinkit uses TWO unavailable wordings in this
  # same slot - "Out of stock" (tw-text-grey-700) and "Coming soon"
  # (tw-text-yellow-700) - so match on text, not colour, and never on a price.
  out_of_stock: 'div.tw-text-200.tw-font-medium:has-text("Out of stock"), div.tw-text-200.tw-font-medium:has-text("Coming soon")'

  # TODO capture from YOUR logged-in session with a delivery address set.
  # These cannot be derived anonymously: with no address Blinkit reports every
  # product unavailable, so the in-stock markup never renders.
  # Run: python main.py --capture   (on an IN-STOCK product page)
  # The main CTA in the sticky bar. MUST stay scoped to that bar: recommendation
  # cards further down the page carry their own role=button "ADD" controls, and
  # an unscoped match would buy the wrong car.
  add_button: 'div.tw-items-center.tw-justify-between.tw-p-3 div[role="button"]:has-text("Add to cart")'
  # Blinkit interstitially pushes its app over the page; this is the escape link.
  dismiss_modal: 'div[class*="DownloadAppModal__ContinueLink"]'
  # Unit price shown in the sticky bar, used as a pre-cart sanity check.
  bar_price: 'div.tw-items-center.tw-justify-between.tw-p-3 div.tw-text-400.tw-font-bold' 
  quantity_stepper: 'div[class*="AddToCart__UpdatedButtonContainer"]'
  login_wall: ""
  cart_open: ""
  # Web cart (/cart, mobile layout). Verified live 2026-11-11.
  cart_items: 'div[class*="CartProduct__Container"]'
  cart_line_title: 'div[class*="ProductTitle"]'
  # Qty is the bare text node between the two stepper buttons (the icons are font
  # glyphs that render as letters/digits, so never regex the whole container).
  # Steppers report "outside of viewport", so the code JS-clicks them.
  cart_minus: 'div[class*="AddToCart___StyledDiv-"]'
  # Checkout: Proceed -> address sheet (picked by pincode) -> Proceed To Pay ->
  # /checkout with the Zomato payment iframe. Verified to the Cash option 2026-11-11.
  proceed_to_pay: 'div:has-text("Proceed To Pay"), button:has-text("Proceed To Pay")'
  payment_frame: '#payment_widget'
  cod_option: "div[title='Cash']"
  cart_address: ""
  cart_total: ""

  # Mode C (Cash on Delivery).
  checkout_button: 'text="Proceed"'
  payment_methods: ""
  wallet_balance: ""
  # On the main page, not inside the iframe. Carries [disabled] until a payment
  # method is chosen. Verified 2026-11-11.
  pay_button: 'div[class*="Zpayments__Button"]:has-text("Pay Now"):visible'
  otp_input: ""
  order_confirmation: ""
  order_id: ""
  order_history: ""

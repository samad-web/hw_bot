services:
  hw_bot:
    build: .
    container_name: blinkit_hotwheels_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Directories, never single files: state.json is rewritten atomically with
      # os.replace(), and replacing a bind-mounted FILE fails with EBUSY.
      # The container keeps its OWN profile. Never mount the host's ./profile:
      # a Windows Chromium profile cannot be read by Linux Chromium, and the
      # container writing into it would corrupt the one --login/--capture use.
      - ./profile-docker:/app/profile
      - ./data:/app/data           # state.json — holds the single-order lock
      - ./logs:/app/logs           # rotating logs + failure captures
      - ./config.yaml:/app/config.yaml:ro
      # Portable login, exported on the machine where the OTP happened. A
      # Windows Chromium profile cannot be decrypted on Linux, so the session
      # travels as JSON and is imported into the fresh profile on first run.
      - ./session.json:/app/session.json:ro
    environment:
      - TZ=Asia/Kolkata
